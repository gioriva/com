  <style>
    :root {
      --bg: #070a0f;
      --ink: #dbe4f0;
      --dim: rgba(219, 228, 240, 0.42);
      --accent: #6fb7ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* vignetta: scurisce i bordi e fa emergere il centro */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 75% 70% at 50% 62%, transparent 45%, rgba(7, 10, 15, 0.92) 100%);
    }

    .hud {
      position: fixed;
      left: 0;
      right: 0;
      bottom: clamp(18px, 3vh, 30px);
      text-align: center;
      pointer-events: none;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
      opacity: 0;
      animation: fade 1.8s ease 1s forwards;
    }
    .hud i { font-style: normal; color: var(--accent); margin: 0 10px; }

    .center {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transform: translateY(-14vh);
    }

    .wordmark {
      font-size: clamp(14px, 1.7vw, 18px);
      font-weight: 500;
      letter-spacing: 0.5em;
      text-indent: 0.5em;
      color: var(--ink);
      opacity: 0;
      animation: fade 2s ease 0.8s forwards;
    }

    .wordmark::after {
      content: "_";
      color: var(--accent);
      animation: blink 1.1s steps(2, start) infinite;
    }

    @keyframes fade { to { opacity: 1; } }
    @keyframes blink { to { visibility: hidden; } }

    @media (max-width: 600px) {
      .hud { font-size: 10px; letter-spacing: 0.1em; }
      .hud i { margin: 0 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hud, .wordmark { animation: none; opacity: 1; }
      .wordmark::after { animation: none; }
    }
  </style>
</head>
<body>

  <canvas id="c" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <div class="center">
    <span class="wordmark">gioriva.com</span>
  </div>

  <div class="hud" aria-hidden="true">45.8081° N 9.0852° E<i>·</i>Como, IT<i>·</i><span id="clock">--:--:--</span></div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const SPEED = reduced ? 0.5 : 1;   // con "riduci movimento" l'onda rallenta ma non si ferma

    let W, H, DPR, COLS, ROWS, XR;
    function resize() {
      const mobile = innerWidth < 600;
      DPR = Math.min(devicePixelRatio || 1, mobile ? 1.5 : 2);
      W = canvas.width = Math.round(innerWidth * DPR);
      H = canvas.height = Math.round(innerHeight * DPR);
      // densità della griglia in base alla larghezza
      COLS = mobile ? 110 : 200;
      ROWS = mobile ? 60 : 80;
      // larghezza del piano in scena: su schermi stretti si restringe, così i punti restano fitti
      XR = 20 * Math.max(0.4, Math.min(1, (innerWidth / innerHeight) / 1.6));
    }
    resize();
    addEventListener('resize', resize);

    // camera fissa, leggermente dall'alto
    const cam = { y: 0.75, f: 1.55 };
    const TOUCH = matchMedia('(hover: none)').matches;
    const AMP = TOUCH ? 1.35 : 1;      // su touch onda più visibile
    let lastTouch = -1e9;              // ultimo tocco reale
    const K = () => cam.f * H * 0.62;      // fattore di proiezione
    const pointer = { x: 0, z: 0, s: 0 }; // punto in scena e forza del ripple
    let ripple = 0;

    function toScene(clientX, clientY) {
      // proiezione inversa approssimata del cursore sul piano y=0
      const off = Math.max(0.02, clientY / innerHeight - 0.5);
      const pz = Math.min(10.4, cam.y * cam.f * 0.62 / off);
      pointer.z = pz - 0.4;
      pointer.x = (clientX - innerWidth / 2) * pz / (cam.f * 0.62 * innerHeight);
      pointer.s = 1;
    }
    addEventListener('pointermove', e => { toScene(e.clientX, e.clientY); lastTouch = performance.now(); }, { passive: true });
    addEventListener('pointerdown', e => { toScene(e.clientX, e.clientY); ripple = 1; lastTouch = performance.now(); }, { passive: true });

    // senza mouse (o dopo 3 s senza tocchi) un punto di pressione vaga da solo sul piano
    function autoPointer(t) {
      if (!TOUCH || t - lastTouch < 3000) return;
      const k = t * 0.00022 * SPEED;
      pointer.x = Math.sin(k * 1.3) * (XR * 0.28);
      pointer.z = 2.6 + (Math.sin(k * 0.9 + 1.7) * 0.5 + 0.5) * 3.5;
      pointer.s += (0.9 - pointer.s) * 0.02;
      if (Math.sin(k * 0.45) > 0.995 && ripple < 0.05) ripple = 1;
    }

    // colori precalcolati (16 livelli di alpha per ciascuna tinta)
    const LEVELS = 16;
    const PAL_INK = [], PAL_ACC = [];
    for (let i = 0; i < LEVELS; i++) {
      const a = (i + 1) / LEVELS;
      PAL_INK.push(`rgba(219,228,240,${a.toFixed(3)})`);
      PAL_ACC.push(`rgba(111,183,255,${a.toFixed(3)})`);
    }

    const clock = document.getElementById('clock');
    const fmt = new Intl.DateTimeFormat('it-IT', {
      hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Europe/Rome'
    });
    let lastT = 0;

    function frame(t) {
      const dt = Math.min(100, t - lastT); lastT = t;

      autoPointer(t);
      if (!TOUCH || t - lastTouch < 3000) pointer.s *= 0.97;
      ripple *= 0.985;

      ctx.fillStyle = '#070a0f';
      ctx.fillRect(0, 0, W, H);

      const time = t * 0.00035 * SPEED;
      const cx = W / 2, cy = H / 2;

      // disegno dal fondo verso il davanti
      for (let r = ROWS - 1; r >= 0; r--) {
        const z = 0.6 + (r / ROWS) * 9.4;              // parte sotto il bordo inferiore, così non si stacca mai
        for (let c = 0; c < COLS; c++) {
          const x = ((c / (COLS - 1)) - 0.5) * XR;   // larghezza -XR/2 .. XR/2

          // superficie: due onde incrociate + un'increspatura dal cursore
          const near = Math.min(1, (r / ROWS) * 3.5);   // le prime file restano piatte: il bordo inferiore non si scopre mai
          const amp = (0.95 - (r / ROWS) * 0.6) * AMP * near; // il fondo si calma, così non si aggroviglia
          let y = (Math.sin(x * 0.32 + time * 1.4) * 0.16
                + Math.sin(z * 0.55 - time * 1.1) * 0.14
                + Math.sin((x + z) * 0.22 + time * 0.7) * 0.10) * amp;

          const dx = x - pointer.x, dz = z - pointer.z;
          const d = Math.sqrt(dx * dx + dz * dz);
          y += Math.exp(-d * d * 1.6) * 0.35 * pointer.s;
          y += Math.sin(d * 6 - t * 0.008) * Math.exp(-d * 0.9) * 0.12 * ripple;

          // proiezione prospettica
          const pz = z + 0.4;                    // distanza dalla camera
          const py = y - cam.y;
          const sx = cx + (x / pz) * K();
          const sy = cy - (py / pz) * K();

          if (sy < -10 || sy > H + 10 || sx < -10 || sx > W + 10) continue;

          const depth = 1 - r / ROWS;                       // 1 vicino, 0 lontano
          const lift = Math.max(0, y + 0.25);               // le creste brillano
          const far = Math.min(1, (1 - r / ROWS) * 4);  // dissolvenza sull'orizzonte
          const a = (0.12 + depth * 0.45 + lift * 0.6) * far;
          const size = (0.6 + depth * 1.2 + lift * 1.0) * DPR;

          if (a < 0.04) continue;
          const idx = Math.min(LEVELS - 1, (a * LEVELS) | 0);
          ctx.fillStyle = lift > 0.42 ? PAL_ACC[idx] : PAL_INK[idx];
          ctx.fillRect(sx - size / 2, sy - size / 2, size, size);
        }
      }

      requestAnimationFrame(frame);
    }

    clock.textContent = fmt.format(new Date());
    setInterval(() => { clock.textContent = fmt.format(new Date()); }, 1000);
    requestAnimationFrame(frame);
  </script>

</body>
</html>
